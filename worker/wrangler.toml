# Solutions Footprint back end (Cloudflare Worker)
# Secrets are NOT kept here. Add them in Cloudflare: Worker > Settings > Variables and Secrets:
#   GITHUB_TOKEN      fine-grained GitHub key (Contents and Issues: read and write)
#   ADMIN_PASSWORD    password for the admin pages
#   TURNSTILE_SECRET  optional, Turnstile secret key (spam protection on the form)

name = "solutions-footprint"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "solutions-footprint"
database_id = "d56e51cd-224d-4a57-be0e-1b8c50f38c4f"

[vars]
GITHUB_REPO = "mdfazlulkarim/durablesolutionshub"
GITHUB_BRANCH = "main"
INBOX_REPO = "mdfazlulkarim/durable-solutions-sudan-inbox"
SITE_URL = "https://durablesolutionshub.org/sudan/mapping/"
# folder of the Sudan map inside the repository
SITE_DIR = "sudan/mapping/"
ALLOWED_ORIGINS = "https://durablesolutionshub.org,https://www.durablesolutionshub.org,https://mdfazlulkarim.github.io"
COMMIT_NAME = "Md Fazlul Karim"
COMMIT_EMAIL = "fozlulkarim@gmail.com"
GITHUB_API = "https://api.github.com"
