# Solutions Footprint back end (Cloudflare Worker)
# Secrets are NOT kept here. Add them in Cloudflare: Worker > Settings > Variables and Secrets:
#   GITHUB_TOKEN      fine-grained GitHub key for durablesolutionshub and durable-solutions-sudan (Contents: read and write)
#   RESEND_API_KEY    Resend key, used to email the 6-digit sign-in codes
#   TURNSTILE_SECRET  optional, Turnstile secret key (spam protection on the form)

name = "solutions-footprint"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "solutions-footprint"
database_id = "d56e51cd-224d-4a57-be0e-1b8c50f38c4f"

[vars]
GITHUB_REPO = "mdfazlulkarim/durablesolutionshub"
GITHUB_BRANCH = "main"
SITE_URL = "https://durablesolutionshub.org/sudan/mapping/"
# folder of the Sudan map inside the repository
SITE_DIR = "sudan/mapping/"
# The git page: every change is copied there too, so both sites stay identical (its site is at the root)
MIRROR_REPO = "mdfazlulkarim/durable-solutions-sudan"
MIRROR_DIR = ""
ALLOWED_ORIGINS = "https://durablesolutionshub.org,https://www.durablesolutionshub.org,https://mdfazlulkarim.github.io"
COMMIT_NAME = "Md Fazlul Karim"
COMMIT_EMAIL = "fozlulkarim@gmail.com"
GITHUB_API = "https://api.github.com"
# People who can always sign in as DSU admin (comma separated). Others are added on the Approved editors page.
ADMIN_EMAILS = "md.karim@un.org"
ADMIN_NAMES = "Md Fazlul Karim"
MAIL_FROM = "Durable Solutions Hub <no-reply@durablesolutionshub.org>"
CONTACT_EMAIL = "dswg.sd@undp.org"
# Who gets an email when a new project or a change is waiting for review (comma separated)
ALERT_EMAILS = "md.karim@un.org"
# Latest ReliefWeb reports on the women and girls page: add the appname approved by ReliefWeb, for example
# RELIEFWEB_APPNAME = "durablesolutionshub-sudan-women"
